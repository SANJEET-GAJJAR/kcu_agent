# config/models.yaml
# KCU Agent Model Configuration
# Last Updated: 2026-06-29

version: 1

defaults:
  timeout_seconds: 300
  max_retries: 2
  fallback_on_failure: true

market_provider:
  provider: tradingview-mcp
  capabilities:
    - replay
    - screenshots
    - candle_extraction
    - chart_navigation

deterministic_engine:
  provider: python
  capabilities:
    - replay_engine
    - indicator_calculation
    - feature_extraction
    - trade_simulation
    - statistics
    - validation
    - file_generation

implementation_model:
  provider: ollama-cloud
  model: glm-5.2:cloud
  command: "ollama run glm-5.2:cloud"
  signin_command: "ollama signin"
  capabilities:
    - code_generation
    - refactoring
    - documentation
    - json_generation
    - schema_generation
    - implementation_planning
    - setup_classification
    - boilerplate
    - repetitive_coding
  fallback_order:
    - provider: ollama-cloud
      model: qwen3:14b:cloud
      command: "ollama run qwen3:14b:cloud"
    - provider: local-ollama
      model: qwen3:14b
      command: "ollama run qwen3:14b"
  # Claude must NOT be used for implementation tasks.
  # Use this model for Phase 5 trade simulation and all repetitive coding.

architecture_model:
  provider: claude
  model: opus
  scope: "architecture, repository design, complex debugging, integration, conflict resolution only"
  capabilities:
    - architecture
    - repository_design
    - complex_reasoning
    - debugging
    - implementation_review
    - conflict_resolution
  # Claude is NOT the implementation model.
  # Minimize Claude token usage: delegate all repetitive coding to implementation_model.

review_model:
  provider: codex
  capabilities:
    - python_review
    - optimization
    - test_generation
    - static_analysis

routing:
  architecture: architecture_model
  implementation: implementation_model
  replay_engine: deterministic_engine
  indicator_calculation: deterministic_engine
  feature_extraction: deterministic_engine
  trade_simulation: implementation_model
  statistics: deterministic_engine
  validation: deterministic_engine
  documentation: implementation_model
  boilerplate: implementation_model
  testing: review_model
  code_review: review_model

policies:
  deterministic_first: true
  minimize_architecture_tokens: true
  allow_fallback_models: true
  never_use_llm_for_math: true
  never_use_llm_for_indicator_calculation: true
  never_use_future_candles: true
  preflight_mandatory: true
  implementation_by_worker_model: true
