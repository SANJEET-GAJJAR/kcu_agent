<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Group 6 War Room</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: one idea per screen. A slim top bar (four areas + emergency) over a single reading column of large cards; a step strip shows where you are in the 20-minute prep. */
:root{
  --bg:#F2F4F3; --surface:#FFFFFF; --surface-2:#E8EDEB; --ink:#16201D; --ink-2:#4B5955; --line:#D2DAD7;
  --accent:#1D4D6A; --accent-ink:#FFFFFF; --accent-soft:#DDE9F0;
  --them:#963820; --them-bg:#F7E8E2;
  --us:#1B5868; --us-bg:#E0EFF2;
  --fact:#4A5B1C; --fact-bg:#EDF1DD;
  --question:#46398A; --question-bg:#ECE9F7;
  --warn:#875700; --warn-bg:#FAEFD6;
  --danger:#B42318; --danger-bg:#FBE4E1;
  --font-body:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
  --font-label:"IBM Plex Sans Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --radius:8px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1514; --surface:#172020; --surface-2:#1F2A29; --ink:#E5ECEA; --ink-2:#A5B3AF; --line:#2E3B39;
    --accent:#86B8D4; --accent-ink:#0B1820; --accent-soft:#1A3140;
    --them:#E8927A; --them-bg:#3A231C; --us:#80C6D6; --us-bg:#15313A; --fact:#BCCD8A; --fact-bg:#272F14;
    --question:#B8AEF2; --question-bg:#29244A; --warn:#E9B958; --warn-bg:#3A2D10; --danger:#FF8C80; --danger-bg:#401C18;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1514; --surface:#172020; --surface-2:#1F2A29; --ink:#E5ECEA; --ink-2:#A5B3AF; --line:#2E3B39;
  --accent:#86B8D4; --accent-ink:#0B1820; --accent-soft:#1A3140;
  --them:#E8927A; --them-bg:#3A231C; --us:#80C6D6; --us-bg:#15313A; --fact:#BCCD8A; --fact-bg:#272F14;
  --question:#B8AEF2; --question-bg:#29244A; --warn:#E9B958; --warn-bg:#3A2D10; --danger:#FF8C80; --danger-bg:#401C18;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-label);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,38px);font-weight:700}
h2{font-size:clamp(21px,3vw,26px);font-weight:700}
h3{font-size:18px;font-weight:600}
p{margin:0}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.label{font-family:var(--font-label);font-size:12.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2)}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* Top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{max-width:1040px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding-block:8px}
.brand{font-family:var(--font-label);font-weight:700;letter-spacing:.05em;background:none;border:0;padding:4px 0;cursor:pointer;font-size:15px}
.brand span{color:var(--accent)}
.nav{display:flex;gap:2px;flex-wrap:wrap}
.nav button{border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;font-family:var(--font-label);font-weight:600;letter-spacing:.05em;font-size:14px;color:var(--ink-2)}
.nav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.bar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.linkbtn{border:0;background:none;cursor:pointer;color:var(--ink-2);font-size:13.5px;text-decoration:underline;text-underline-offset:3px;padding:6px 4px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:9px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.big{padding:13px 20px;font-size:17px}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600}
.btn.ghost{background:none}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}

main{padding-block:24px 72px}

/* Step strip */
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.step{border:0;background:none;padding:0;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px}
.step i{display:block;height:4px;border-radius:2px;background:var(--line)}
.step span{font-size:12px;color:var(--ink-2);font-family:var(--font-label);letter-spacing:.04em;line-height:1.25}
.step[aria-current="step"] i{background:var(--accent)}
.step[aria-current="step"] span{color:var(--ink);font-weight:600}
.step.done i{background:var(--us)}
@media (max-width:560px){.step span b{display:none}}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:14px}
.card.tight{padding:16px;gap:10px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid > *{min-width:0}
.lead{font-size:clamp(19px,2.6vw,23px);line-height:1.45;font-weight:500}
.spoken{font-size:17.5px;line-height:1.6}
.next{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:6px}

.tag{display:inline-block;font-family:var(--font-label);font-size:11.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;padding:3px 8px;border-radius:4px}
.t-them{background:var(--them-bg);color:var(--them)} .t-us{background:var(--us-bg);color:var(--us)} .t-fact{background:var(--fact-bg);color:var(--fact)} .t-q{background:var(--question-bg);color:var(--question)} .t-warn{background:var(--warn-bg);color:var(--warn)} .t-n{background:var(--surface-2);color:var(--ink-2)}
.blk{border-left:3px solid var(--line);padding:4px 0 4px 14px;display:flex;flex-direction:column;gap:6px}
.blk.them{border-color:var(--them)} .blk.us{border-color:var(--us)} .blk.fact{border-color:var(--fact)} .blk.q{border-color:var(--question)} .blk.warn{border-color:var(--warn)}

/* Strategy: the distinction */
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.split{grid-template-columns:1fr}}
.side{border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:8px}
.side.yes{background:var(--us-bg)} .side.no{background:var(--them-bg)}
.side h3{font-size:16px;letter-spacing:.04em}
.side.yes h3{color:var(--us)} .side.no h3{color:var(--them)}
ol.reasons{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px;counter-reset:r}
ol.reasons li{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start;counter-increment:r}
ol.reasons li::before{content:counter(r);font-family:var(--font-mono);font-weight:600;font-size:15px;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center}

/* Roles */
.people{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.person{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.person:hover{border-color:var(--accent)}
.person b{font-family:var(--font-label);font-size:14px;letter-spacing:.08em;color:var(--accent)}
.person span{font-size:16.5px;line-height:1.35;font-weight:500}
.sect{display:flex;flex-direction:column;gap:6px;padding-block:4px}
.sect + .sect{border-top:1px solid var(--line);padding-top:16px}
.qseq{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.qseq dt{font-family:var(--font-label);font-weight:700;font-size:12.5px;letter-spacing:.08em;color:var(--question);white-space:nowrap}
.qseq dd{margin:0}
@media (max-width:480px){.qseq{grid-template-columns:1fr}.qseq dd{padding-bottom:6px}}
.deeper{border-top:1px dashed var(--line);padding-top:14px}

/* Practice */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:10px 16px;cursor:pointer;font-family:var(--font-label);font-weight:600;letter-spacing:.04em}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.attack{font-size:clamp(20px,3vw,25px);line-height:1.4;font-weight:500;color:var(--ink)}
.attack::before{content:"“"} .attack::after{content:"”"}
.count{font-family:var(--font-mono);font-weight:600;font-size:34px;font-variant-numeric:tabular-nums;min-width:90px;text-align:center;padding:4px 12px;border-radius:var(--radius);border:1px solid var(--line);background:var(--surface-2)}
.count.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.count.crit{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.reveal-list{display:flex;flex-direction:column;gap:12px}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.board button{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.board b{font-family:var(--font-label);letter-spacing:.06em}
.board span{font-family:var(--font-mono);font-size:20px;font-variant-numeric:tabular-nums}
.progress{font-family:var(--font-mono);font-size:13px;color:var(--ink-2)}

/* Debate day */
.huddle{background:var(--surface);border:2px solid var(--ink);border-radius:var(--radius);padding:22px;display:flex;flex-direction:column;gap:16px}
.huddle h2{font-size:22px}
.hgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.hgrid > *{min-width:0}
.huddle ol,.huddle ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.own{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.own b{font-family:var(--font-mono)}
.chainbar{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:640px){.chainbar{grid-template-columns:repeat(3,minmax(0,1fr))}}
.clink{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:10px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.clink b{font-family:var(--font-label);font-weight:700;font-size:13px;letter-spacing:.04em;line-height:1.2}
.clink span{font-family:var(--font-mono);font-size:12px;color:var(--ink-2)}
.clink[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.clink[aria-pressed="true"] span{color:var(--accent-ink)}
.topics{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.topic{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius);padding:14px 8px;cursor:pointer;font-family:var(--font-label);font-weight:700;letter-spacing:.05em;font-size:14.5px;text-transform:uppercase}
.topic:hover{border-color:var(--them)}
.topic[aria-pressed="true"]{background:var(--them-bg);border-color:var(--them);color:var(--them)}
.timer{font-family:var(--font-mono);font-weight:600;font-size:clamp(46px,10vw,72px);text-align:center;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:4px 0;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}
.timer.crit{background:var(--danger-bg);color:var(--danger);border-color:var(--danger)}
.notes{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.note{display:flex;flex-direction:column;gap:6px}
.note textarea{width:100%;min-height:52px;resize:vertical;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:6px 8px;font-size:14px}
.note label{font-family:var(--font-label);font-size:11.5px;font-weight:700;letter-spacing:.08em;color:var(--ink-2)}

/* Advanced */
details.adv{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
details.adv > summary{cursor:pointer;padding:16px 18px;font-family:var(--font-label);font-weight:600;font-size:17px;list-style:none;display:flex;justify-content:space-between;gap:10px}
details.adv > summary::-webkit-details-marker{display:none}
details.adv > summary::after{content:"+";font-family:var(--font-mono);color:var(--ink-2)}
details.adv[open] > summary::after{content:"–"}
details.adv > .body{padding:0 18px 18px;display:flex;flex-direction:column;gap:12px}
details.sub summary{cursor:pointer;font-weight:600}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--font-label);font-weight:600;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);background:var(--surface-2)}
tr:last-child td{border-bottom:0}
.transcript .turn{display:grid;grid-template-columns:70px 1fr;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);font-size:15px}
.transcript .who{font-family:var(--font-mono);font-size:12.5px;font-weight:600}
.who.g6{color:var(--us)} .who.g5{color:var(--them)} .who.jd{color:var(--question)}
@media (max-width:520px){.transcript .turn{grid-template-columns:1fr;gap:2px}}

/* Emergency */
.overlay{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.overlay .wrap{padding-block:18px 48px}
.overlay h2{color:var(--danger)}
.overlay ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;font-size:18px}

@media print{
  .bar,.steps,.next,.no-print,#emergency{display:none!important}
  body{background:#fff;color:#000}
  .huddle{border-color:#000}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<header class="bar" id="bar">
  <div class="wrap">
    <button class="brand" type="button" data-go="strategy">GROUP 6 <span>· WAR ROOM</span></button>
    <nav class="nav" aria-label="Main">
      <button type="button" data-go="strategy">Our strategy</button>
      <button type="button" data-go="role">Your role</button>
      <button type="button" data-go="practice">Practice</button>
      <button type="button" data-go="day">Debate day</button>
    </nav>
    <div class="bar-right">
      <button class="linkbtn" type="button" data-go="advanced">Advanced prep</button>
      <button class="btn danger" type="button" data-emergency="open">Emergency</button>
    </div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="overlay" id="emergency" hidden></div>

<script>
"use strict";
/* ============================================================
   CONFIG + RESEARCH DATA (kept from the full strategy; used in
   Debate Day and Advanced Prep). Edit timings here.
   ============================================================ */
const CONFIG = {
  rounds: { opening: 300, rebuttal: 120, final: 120 },
  buffer: { opening: 25, rebuttal: 10, final: 10 },
  presets: [300, 180, 120, 60, 30],
  warnAt: 30,
  criticalAt: 10,
  defaultStructure: "A"
};

const STRUCTURES = {
  A: { name: "A · All five speak every round",
       note: "Everyone opens, rebuts and closes. Order rotates so nobody is always first or last. Handoff: “[Name] on [link].” No thank-yous, no recaps.",
       rounds: { opening: ["P1","P2","P3","P4","P5"], rebuttal: ["P3","P4","P5","P1","P2"], final: ["P1","P2","P3","P4","P5"] } },
  B1: { name: "B1 · One speaker per round",
        note: "Equal speaking time is impossible with three slots and five people. P2 and P4 own cross-examination or points of information if the format has them; otherwise they write the live rebuttal brief. Raise this with staff.",
        rounds: { opening: ["P1"], rebuttal: ["P3"], final: ["P5"] } },
  B2: { name: "B2 · All open, two or three in later rounds",
        note: "Questioning, if it exists, goes to P1 and P5 so time evens out. Rotate the closer if there are several debates.",
        rounds: { opening: ["P1","P2","P3","P4","P5"], rebuttal: ["P2","P3","P4"], final: ["P5","P1"] } },
  B3: { name: "B3 · Cross-examination round exists",
        note: "As B2, plus each speaker asks their primary strategic question once. Whoever did not speak in rebuttal leads cross-examination.",
        rounds: { opening: ["P1","P2","P3","P4","P5"], rebuttal: ["P2","P3","P4"], final: ["P5","P1"], cross: ["P1","P5","P2","P3","P4"] } }
};

/* ============================================================
   CONTENT
   ============================================================ */

const TIERS = [
  { t:"1 · Automatic liability", what:"The platform pays whenever a user's post is false and causes harm, whatever it knew.", ex:"“Platforms are responsible for misinformation on their sites.”", stance:"Oppose" },
  { t:"2 · Negligence / notice liability for falsity", what:"Liable if it “should have known” a post was false, or didn't remove it after a flag.", ex:"“Liable if they ignore reports of misinformation.”", stance:"Oppose" },
  { t:"3 · Independent unlawful platform conduct", what:"Liable for the platform's own wrongful acts, judged by laws that apply to any business.", ex:"Defective or addictive design; its own misleading statements; selling ads it knows are fraudulent; knowingly helping a crime; ignoring a court order.", stance:"Support where the law defines the wrong" }
];

const TRIGGER_TEST = [
  "Is the wrong defined without someone first ruling on what's true?",
  "Is it the platform's own act?",
  "Can the platform comply without becoming the referee of disputed facts?"
];


/* Group 5's likely AI-assisted case */
const G5 = [
 {n:1, title:"Profit from engagement", owner:"P3", assume:"F2 · F3",
  claim:"Platforms profit from engagement, and false content drives engagement, so they should bear the cost.",
  ten:"Profit tells us who can afford rules. It doesn't tell us which posts are false.",
  thirty:"We agree the business model matters. But profit is earned on true posts too. If the problem is monetising harmful content, look at what the platform itself does: the ads it sells, the creators it pays. That's the platform's conduct, and it can be regulated. It still doesn't make the platform liable because a user said something false.",
  q:"If a platform earned nothing from a false post, would your case change?",
  counter:"Banks profit from transactions and are liable for fraud they facilitate.",
  final:"Banks act on fraud the law defines in advance, not on whether a customer's statement is true. That's our line: defined illegality, not falsity."},
 {n:2, title:"Algorithms amplify", owner:"P3", assume:"F3",
  claim:"Recommendation algorithms amplify misinformation, so platforms are active participants, not passive hosts.",
  ten:"If recommendation is the problem, regulate recommendation. That still doesn't make the platform liable because a user's post is false.",
  thirty:"Ranking is a choice; we agree. If recommendation is the problem, regulate recommendation: how it's designed, tested and audited. That still doesn't establish liability simply because the underlying user post is false. And a large MIT study found people, not bots, mainly spread false stories.",
  q:"If the same post were shown in date order with no recommending, should the platform still be liable?",
  counter:"One US appeals court has said the algorithm is the platform's own speech, so it can be liable.",
  final:"That case was about an app pushing a dangerous challenge to a child. That's conduct, and our line covers it. It isn't a rule about users' false posts."},
 {n:3, title:"Real-world harm", owner:"P5", assume:"F1",
  claim:"Misinformation causes deaths and violence: health scares, election lies, riots.",
  ten:"The harm is real. The question is whether liability for falsity reduces it.",
  thirty:"We said in our first sentence that the harm is real. But harm tells us there's a problem, not that this remedy works. Liability changes behaviour only where truth is unclear, and there it pushes platforms to remove anything contested, including true posts. Targeted tools aim at the harm without a truth referee.",
  q:"What evidence shows liability reduces the harm, rather than just increasing removals?",
  counter:"Some content is clearly false and dangerous, like fake cures.",
  final:"Clearly false and dangerous content is already removable under platform policy and narrow laws. Liability only bites in the grey zone, where the mistakes happen."},
 {n:4, title:"Duty of care / negligence", owner:"P1", assume:"F1 · F2",
  claim:"Platforms owe users a duty of care and should be liable when they negligently fail to act on foreseeable misinformation.",
  ten:"Duties set in advance about systems are one thing. A jury deciding afterwards what was true is another.",
  thirty:"If the duty is about how platforms build and audit their systems, set in advance, that's a more targeted alternative than liability for the truth of users' posts. But negligence for misinformation means a jury later decides a post was false and the platform should have known. That's the referee problem with hindsight.",
  q:"What would a reasonable platform have done with a post whose truth was still disputed?",
  counter:"Negligence works for every other industry.",
  final:"Other industries are negligent about their own products. Here the “defect” would be another person's sentence."},
 {n:5, title:"They already moderate", owner:"P4", assume:"F1",
  claim:"Platforms already remove content. Liability just makes them do it properly.",
  ten:"Moderating under your own policy is different from moderating under threat of a lawsuit.",
  thirty:"Today a platform can make a judgement call and correct it. Under liability, leaving a post up can cost a lawsuit and taking it down costs nothing. Meta itself estimated one or two in every ten removals may already be mistakes. Liability pushes that the wrong way.",
  q:"Under your rule, what does it cost the platform to remove a true post?",
  counter:"A good-faith safe harbour fixes over-removal.",
  final:"Then you've built a process rule, not liability for misinformation. Tell us what it requires."},
 {n:6, title:"Publishers are liable", owner:"P1", assume:"F3",
  claim:"Newspapers are liable for what they publish. Platforms should be too.",
  ten:"Newspapers choose each item before it goes out, and even they generally need to be at fault.",
  thirty:"An editor reads and chooses each piece before it goes out, and even then is generally liable only when at fault. Platforms carry millions of posts no one at the company has seen. Before 1996, treating a moderating service like a publisher meant the site that tried to moderate got sued. That's why the law changed.",
  q:"Should a platform be liable for a post no one at the company has seen?",
  counter:"Algorithms are the editor now.",
  final:"Then target the algorithm's design. That's conduct. It doesn't need a ruling on whether each post is true."},
 {n:7, title:"Product liability", owner:"P3", assume:"F3",
  claim:"A platform is a product. A defective product that spreads misinformation should carry liability.",
  ten:"Design defects are already being litigated. That's our line.",
  thirty:"Courts are already holding platforms responsible for how they design their products. A jury did so this year over addictive design. That targets what the platform built. A user's false sentence isn't a design defect.",
  q:"Is the defect the design, or the content of a user's post?",
  counter:"A design that spreads misinformation is a defective design.",
  final:"Then prove the design defect, as those plaintiffs did. That's conduct. You still don't need the platform to rule on what's true."},
 {n:8, title:"Victims need remedies", owner:"P5", assume:"F4",
  claim:"Victims need someone to sue, and anonymous speakers can't be reached.",
  ten:"They can sue the speaker, and sue the platform for its own conduct. Both exist today.",
  thirty:"Victims can sue the person who lied, and in serious cases courts can order a platform to help identify them. Platforms can be sued for their own conduct. If there's a gap, fill it with a targeted fix, not a rule that makes every platform liable for disputed truth.",
  q:"Who exactly can sue under your rule: the person harmed, or anyone misled?",
  counter:"Unmasking is slow and speakers often can't pay.",
  final:"Then the gap is about identifying and recovering from speakers. Fix that gap directly."},
 {n:9, title:"No incentive without liability", owner:"P4", assume:"F2",
  claim:"Without liability, platforms have no reason to act.",
  ten:"Incentive to do what: be accurate, or remove anything risky?",
  thirty:"Platforms already act because of advertisers, users and regulators. The question is what liability adds. When keeping a post up can cost a lawsuit and taking it down costs nothing, the incentive is removal, not accuracy. We've seen that pattern: after the 2018 trafficking law, one big site simply shut a whole section.",
  q:"Which mistake costs the platform money under your rule: leaving false posts up, or taking true ones down?",
  counter:"Meta ended fact-checking in 2025. Voluntary action isn't enough.",
  final:"Agreed, voluntary steps can be reversed. If regulation is needed, process-based duties are a more targeted alternative than liability based on determining whether users' statements are true."},
 {n:10, title:"AI can moderate", owner:"P4", assume:"F1",
  claim:"AI now makes it possible to detect misinformation at scale.",
  ten:"AI copies past labels. New disputed claims are exactly what it gets wrong.",
  thirty:"AI is trained on what people labelled false before. New, disputed claims are where it struggles, and those are the cases that matter. Meta itself estimated one or two in ten removals may be mistakes. Liability would push the error toward removing more.",
  q:"Who is liable when the AI removes a true post?",
  counter:"AI is improving quickly.",
  final:"Better tools are welcome. They don't change who must decide disputed truth, or the incentive to over-remove."},
 {n:11, title:"Section 230 is outdated", owner:"P1", assume:"F4",
  claim:"Section 230 was written in 1996 for a different internet.",
  ten:"Review it, sure. The motion is about what should trigger liability.",
  thirty:"We agree the law deserves review, and Congress is debating it. But it already excludes federal crimes and copyright, and courts are already letting design claims through. Reforming it doesn't answer the question: what should make a platform liable when a user posts something false?",
  q:"What would replace it, and what triggers liability under the replacement?",
  counter:"Repeal it and let courts work it out.",
  final:"Then courts face the same question with no answer: who decides the post was false, and what did the platform do?"},
 {n:12, title:"Other industries are liable", owner:"P3", assume:"F3",
  claim:"Car makers, drug companies and banks are liable for harms they facilitate.",
  ten:"For what they make, not for what their customers say.",
  thirty:"Those industries are liable for their own products and conduct. A phone company isn't liable for a lie told on a call. The fair comparison is liability for the platform's own design and statements, which already exists.",
  q:"Is a phone company liable for a lie told on a call?",
  counter:"Platforms curate; phone companies don't.",
  final:"Then regulate the curation. If recommendation is the problem, regulate recommendation."},
 {n:13, title:"They know it's there", owner:"P2", assume:"F1",
  claim:"Platforms know misinformation is on their sites and do too little.",
  ten:"Knowing misinformation exists isn't knowing this post is false.",
  thirty:"Knowing misinformation exists isn't the same as knowing this post is false. The Supreme Court has said running a service everyone uses isn't the same as knowingly helping wrongdoing. And knowledge-based liability creates a perverse incentive: don't look.",
  q:"What exactly must the platform know: that misinformation exists, or that this post is false?",
  counter:"Repeat offenders are known.",
  final:"Account-level rules on repeat offenders are a policy and process question. They don't need liability for the truth of each post."},
 {n:14, title:"Europe does it", owner:"P5", assume:"F5 · F6",
  claim:"Europe holds platforms accountable. The US should too.",
  ten:"Europe makes hosts act on illegal content they know about. It doesn't make them liable just because content is false.",
  thirty:"Europe makes hosts act on illegal content once they know about it, and requires the biggest platforms to assess and reduce risks in their systems. It doesn't make them liable just because lawful content is false. Even Europe sets different rules by size and type of service.",
  q:"Which European rule makes a host liable for lawful content because it's false?",
  counter:"Europe's human-rights court allowed liability for comments.",
  final:"For clearly illegal hate speech and threats. The same court refused liability for merely offensive comments."},
 {n:15, title:"Fraud and scam ads", owner:"P5", assume:"—",
  claim:"Scam ads and financial fraud cost people enormous sums.",
  ten:"Paid ads are the platform's own business. Liability fits our line.",
  thirty:"Fraud is already illegal. When a platform sells an ad it knows is a scam, that's the platform's own commercial conduct, and liability can follow. That's very different from liability because a user's post is false.",
  q:"Is the platform's liability for the ad it sold, or for a user's post?",
  counter:"Then extend that to ordinary posts.",
  final:"Ordinary posts aren't the platform's sale. Extending it brings back the referee problem."}
];

 {id:"E17", type:"BH", title:"EU Digital Services Act: hosting", src:"Regulation (EU) 2022/2065, Arts. 6 and 8", date:"2022", find:"Hosts are exempt from liability unless they know about illegal content and fail to act quickly. There's no general duty to monitor.", limit:"Europe does use knowledge-based liability, for illegal content. Lawful but false content isn't “illegal content” unless national law says so.", say:"Europe makes hosts act on illegal content once they know about it. It doesn't make them liable for content that's merely false.", url:"https://www.springlex.eu/en/packages/dsa/dsa-regulation/article-6/"},
 {id:"E18", type:"BH", title:"TAKE IT DOWN Act", src:"US statute; FTC enforcement", date:"2025; enforced from 19 May 2026", find:"Covered platforms must remove non-consensual intimate images within 48 hours of a valid request; good-faith removal is protected.", limit:"Critics warn of abuse because requests aren't identity-checked. Intimate images, not misinformation.", say:"Congress has passed narrow, defined takedown laws, like the one for intimate images.", url:"https://www.ftc.gov/node/332128"},
 {id:"E19", type:"NB", title:"Speakers held to account", src:"Dominion–Fox settlement; Sandy Hook verdicts against Alex Jones", date:"2023; 2022", find:"Speakers and broadcasters faced major consequences for their own falsehoods ($787.5M settlement; large defamation verdicts).", limit:"A settlement isn't a ruling; state-court verdicts.", say:"When speakers spread damaging lies, they've been held to account.", url:"https://en.wikipedia.org/wiki/Dominion_Voting_Systems_v._Fox_News_Network"},
 {id:"E20", type:"ADV", title:"Cost of defending lawsuits", src:"Engine; CCIA", date:"various", find:"Industry groups estimate defending even a baseless suit can cost a startup tens of thousands of dollars or more.", limit:"Advocacy estimates. Don't quote the figures.", say:"Even winning a lawsuit is expensive for a small site.", url:"https://www.engine.is/news/primer/section230costs"},
 {id:"E21", type:"INF", title:"Bills to sunset Section 230", src:"Senate (Graham/Durbin); House H.R. 10332", date:"Dec 2025; Sept 2026", find:"Bipartisan bills would end Section 230 after a set period unless it's replaced.", limit:"Introduced only. Recheck status before the debate.", say:"There are bipartisan bills to sunset that law. The debate is live.", url:"https://www.judiciary.senate.gov/press/dem/releases/durbin-graham-introduce-bill-to-sunset-section-230-immunity-for-tech-companies-protect-americans-online"},
 {id:"E22", type:"BH", title:"Barrett v. Rosenthal", src:"California Supreme Court", date:"2006", find:"Section 230 protects individual users who repost others' content, even after notice. The court acknowledged troubling consequences.", limit:"Binding in California; persuasive elsewhere.", say:"The law protects ordinary users who share someone else's post.", url:"https://www.dmlp.org/print/322"},
 {id:"E23", type:"BH", title:"Zeran v. AOL", src:"US Court of Appeals, 4th Circuit", date:"1997", find:"Section 230 bars liability based simply on the platform being notified about a post.", limit:"One circuit, widely followed; some justices have questioned it.", say:"Courts have rejected liability just because a platform was told about a post.", url:"https://en.wikipedia.org/wiki/Zeran_v._America_Online,_Inc."},
 {id:"E24", type:"BH", title:"Roommates.com and Kimzey v. Yelp", src:"US Court of Appeals, 9th Circuit", date:"2008; 2016", find:"A platform that materially contributes to unlawful content loses protection; a neutral tool like an aggregate star rating doesn't.", limit:"9th Circuit.", say:"Courts treat a platform differently when it helps create the content.", url:"https://blog.ericgoldman.org/archives/2016/09/ninth-circuit-criticizes-attempts-to-plead-around-secton-230-kimzey-v-yelp.htm"},
 {id:"E25", type:"BH", title:"Texas and Florida platform laws", src:"Texas HB 20; Florida SB 7072", date:"2021", find:"Applied only to large platforms (Texas: reportedly over 50 million monthly US users; Florida: revenue or user thresholds).", limit:"Verify the thresholds. Both laws were sent back for further review.", say:"Even US states draw lines by size.", url:"https://en.wikipedia.org/wiki/Moody_v._NetChoice,_LLC"},
 {id:"E26", type:"BH", title:"EU Digital Services Act: tiers", src:"Regulation (EU) 2022/2065, Arts. 4–6, 19, 33", date:"2022", find:"Separate rules for conduit, caching and hosting services. Micro and small platforms are exempt from most platform duties. Extra duties apply to very large platforms with 45 million or more EU users.", limit:"EU only.", say:"Europe sets different rules by type and size of service.", url:"https://presencis.com/regulations/dsa/applicability/"},
 {id:"E27", type:"BH", title:"UK Online Safety Act thresholds", src:"Threshold Conditions Regulations 2025", date:"Feb 2025", find:"Top tier: a recommender system plus over 34 million UK users, or over 7 million with resharing. Messaging tier: over 3 million users with direct messaging. Wikimedia sought judicial review.", limit:"UK only; outcome of the challenge unknown.", say:"The UK sets duties by size and features.", url:"https://legislation.gov.uk/ukdsi/2025/9780348267174"},
 {id:"E28", type:"BH", title:"Germany's NetzDG", src:"Network Enforcement Act", date:"2017", find:"Exempted platforms under 2 million German users; 24-hour removal only for manifestly unlawful content.", limit:"Largely superseded by the EU Digital Services Act since 2024.", say:"Germany limited its law to bigger platforms and clearly illegal content.", url:"https://cdt.org/insights/overview-of-the-netzdg-network-enforcement-law/"},
 {id:"E29", type:"ADV", title:"Reddit's Supreme Court brief", src:"Reddit amicus brief, Gonzalez v. Google", date:"Jan 2023", find:"Argued that user votes and volunteer moderation depend on Section 230's protection for users.", limit:"Advocacy by an interested company.", say:"Community sites rely on volunteers. Liability would fall on them too.", url:"https://www.technologyreview.com/2023/02/01/1067520/supreme-court-section-230-gonzalez-reddit/"},
 {id:"E30", type:"NB", title:"European and Australian comment cases", src:"Delfi v. Estonia and MTE v. Hungary (European Court of Human Rights); Fairfax v. Voller (High Court of Australia)", date:"2015; 2016; 2021", find:"Delfi: a commercial news portal could be liable for clearly unlawful hate speech and threats in comments. MTE: liability for merely offensive comments violated free expression. Voller: page owners are publishers of Facebook comments under Australian defamation law.", limit:"A human-rights court (not the EU) and Australian defamation law; not about misinformation.", say:"Europe's human-rights court limited liability to clearly illegal hate speech and refused it for merely offensive comments.", url:"https://wilmap.stanford.edu/node/30503"},
 {id:"E31", type:"CO", title:"CNN's response in Australia", src:"Mediaweek; AdNews", date:"Sept 2021", find:"After the Voller ruling, CNN restricted its Facebook pages for Australian users, saying it couldn't disable comments page-wide.", limit:"One company's decision.", say:"After Australia's ruling, CNN pulled its Facebook pages there rather than carry the risk.", url:"https://mediaweek.com.au/cnn-disables-its-australian-facebook-page-in-response-to-high-court-ruling"},

      ${s>=1 ? `<div class="blk us">${tag("us","Best response")}<p class="spoken">${esc(a.best)}</p></div><div class="blk q">${tag("q","Question back")}<p class="spoken">${esc(a.q)}</p></div><p class="small muted">Usually handled by ${pLabel(a.owner)}, but anyone can take it.</p>` : ""}
      ${s>=2 ? `<div class="blk them">${tag("them","They may counter…")}<p class="spoken">${esc(a.counter)}</p></div>` : ""}
      ${s>=3 ? `<div class="blk us">${tag("us","Our final response")}<p class="spoken">${esc(a.final)}</p></div>` : ""}
    </div>
    <div class="row">
      ${s===0?`<button class="btn primary" type="button" data-atstep="1">Reveal best response</button>`:""}
      ${s===1?`<button class="btn primary" type="button" data-atstep="2">They may counter…</button>`:""}
      ${s===2?`<button class="btn primary" type="button" data-atstep="3">Reveal our final response</button>`:""}
      ${s===3?`<button class="btn primary" type="button" data-at="next">${state.at < ATTACKS.length-1 ? "Next attack" : "Start again"}</button>`:""}
    </div>
    ${s>=1 ? `<div class="stack" style="gap:8px"><span class="label">Whose answer was closest? Give a point.</span>
      <div class="board">${Object.keys(pts).map(p=>`<button type="button" data-point="${p}"><b>${p}</b><span>${pts[p]}</span></button>`).join("")}</div>
      <div><button class="linkbtn" type="button" data-point="reset">Reset points</button></div></div>` : ""}
  </article>
  ${nextBtn("Next: final huddle", "day")}`;
}

/* ============================================================
   4. DEBATE DAY
   ============================================================ */
function speakingOrder(){
  const S = STRUCTURES[state.structure];
  return Object.keys(S.rounds).map(r => `<li><b>${r[0].toUpperCase()+r.slice(1)}:</b> ${S.rounds[r].join(" → ")}</li>`).join("");
}
function viewDay(){
  const link = state.dayLink ? ROLES[state.dayLink] : null;
  const atk = state.dayTopic !== null ? ATTACKS[state.dayTopic] : null;
  const notes = LS.get("notes", {});
  return `<div class="stack" style="gap:20px">${stepStrip()}
    <section class="huddle" id="huddle">
      <div class="row between"><h2>Final huddle</h2><span class="small muted">Screenshot this.</span></div>
      <div><span class="label">Our position</span><p class="lead" style="font-size:20px">${esc(POSITION)}</p></div>
      <div class="hgrid">
        <div class="stack" style="gap:6px"><span class="label">Our 3 strongest arguments</span><ol>${REASONS.map(r=>`<li>${esc(r.h)}</li>`).join("")}</ol></div>
        <div class="stack" style="gap:6px"><span class="label">Our 3 best questions</span><ol>${HUDDLE.questions.map(q=>`<li>${esc(q[1])} <span class="small muted">(${q[0]})</span></li>`).join("")}</ol></div>
        <div class="stack" style="gap:6px"><span class="label">What we concede</span><ol>${HUDDLE.concessions.map(c=>`<li>${esc(c)}</li>`).join("")}</ol></div>
      </div>
      <div class="hgrid">
        <div class="stack" style="gap:6px"><span class="label">Who owns what</span>
          <div class="own">${Object.keys(ROLES).map(p=>`<b>${p}</b><span>${esc(ROLES[p].q)}</span>`).join("")}</div></div>
        <div class="stack" style="gap:6px"><span class="label">Speaking order <span class="tag t-warn">Provisional</span></span><ul>${speakingOrder()}</ul><p class="small muted">${esc(STRUCTURES[state.structure].name)}. Change it in Advanced prep.</p></div>
      </div>
      <div class="blk us">${tag("us","30-second emergency closing")}<p class="spoken">${esc(HUDDLE.closing)}</p></div>
    </section>

    <section class="stack no-print" style="gap:12px">
      <h2>During the debate</h2>
      <p class="muted small">Tap a question to see who owns it and their quick line. Tap what Group 5 just said for a 10-second answer.</p>
      <div class="chainbar">${Object.keys(ROLES).map(p=>`<button class="clink" type="button" aria-pressed="${state.dayLink===p}" data-daylink="${p}"><b>${esc(ROLES[p].short)}</b><span>${p}</span></button>`).join("")}</div>
      ${link ? `<div class="card tight"><span class="label">${pLabel(state.dayLink)} · ${esc(link.q)}</span><div class="blk q">${tag("q","Ask")}<p class="spoken">${esc(link.ask.q)}</p></div><div class="blk us">${tag("us","Quick line")}<p class="spoken">${esc(link.respond)}</p></div></div>` : ""}
      <span class="label">Group 5 just said…</span>
      <div class="topics">${ATTACKS.map((a,i)=>`<button class="topic" type="button" aria-pressed="${state.dayTopic===i}" data-daytopic="${i}">${esc(a.title)}</button>`).join("")}</div>
      ${atk ? `<div class="card tight"><div class="blk us">${tag("us","10-second answer")}<p class="spoken">${esc(atk.best)}</p></div><div class="blk q">${tag("q","Question back")}<p class="spoken">${esc(atk.q)}</p></div><p class="small muted">Owner: ${pLabel(atk.owner)}</p></div>` : ""}
      <div class="grid g2" style="align-items:start">
        <div class="stack" style="gap:8px"><div class="timer js-timer">${fmt(timer.remaining)}</div>
          <div class="row" style="justify-content:center">${CONFIG.presets.map(s=>`<button class="btn" type="button" data-preset="${s}">${fmt(s)}</button>`).join("")}</div>
          <div class="row" style="justify-content:center"><button class="btn primary" type="button" data-timer="start">Start</button><button class="btn" type="button" data-timer="pause">Pause</button><button class="btn" type="button" data-timer="reset">Reset</button></div>
          <label class="row small" style="justify-content:center"><input type="checkbox" id="soundToggle" ${timer.sound?"checked":""}> Sound at 0:30 and 0:00</label></div>
        <details class="adv"><summary>Live notes (saved in this browser)</summary><div class="body">
          <div class="notes">${Object.keys(ROLES).map(p=>`<div class="note"><b>${p}</b>${["THEY CLAIM","ASSUMPTION","RESPONSE"].map(f=>{const id=`n-${p}-${f.replace(" ","")}`; return `<label for="${id}">${f}</label><textarea id="${id}" data-note="${p}|${f}">${esc((notes[p]||{})[f]||"")}</textarea>`;}).join("")}</div>`).join("")}</div>
        </div></details>
      </div>
    </section>
  </div>`;
}

/* ============================================================
   ADVANCED PREP (optional, collapsed)
   ============================================================ */
function advSection(title, body, open){ return `<details class="adv" ${open?"open":""}><summary>${esc(title)}</summary><div class="body">${body}</div></details>`; }
function viewAdvanced(){
  const tiers = `<div class="tablewrap"><table><thead><tr><th>Kind of liability</th><th>What it means</th><th>Our stance</th></tr></thead><tbody>${TIERS.map(t=>`<tr><td><b>${esc(t.t)}</b></td><td>${esc(t.what)}<br><span class="small muted">${esc(t.ex)}</span></td><td>${esc(t.stance)}</td></tr>`).join("")}</tbody></table></div>
    <p class="small"><b>Trigger test</b> (why opposing tiers 1–2 and accepting tier 3 isn't a contradiction):</p><ol class="small" style="margin:0;padding-left:20px">${TRIGGER_TEST.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
    <p class="small"><b>Full position:</b> ${esc(POSITION_LONG)}</p>`;
  const evid = `<p class="small muted">Types: ${Object.keys(TYPE_NAMES).map(k=>`${k} = ${esc(TYPE_NAMES[k])}`).join(" · ")}</p>
    ${EVIDENCE.map(e=>`<details class="sub"><summary>${esc(e.id)} · ${esc(e.title)} <span class="tag t-n">${e.type}</span></summary><div class="stack" style="gap:6px;padding:8px 0 4px">
      <p><b>Say:</b> ${esc(e.say)}</p><p class="small"><b>Finding:</b> ${esc(e.find)}</p><p class="small"><b>Limit:</b> ${esc(e.limit)}</p>
      <p class="small">${esc(e.src)} · ${esc(e.date)} · <a href="${esc(e.url)}" target="_blank" rel="noopener">source</a></p></div></details>`).join("")}`;
  const trees = G5.map(x=>`<details class="sub"><summary>#${x.n} ${esc(x.title)} <span class="small muted">(${x.owner})</span></summary><div class="stack" style="gap:6px;padding:8px 0 4px">
    <div class="blk them"><p>${esc(x.claim)}</p></div><div class="blk us"><p><b>10s:</b> ${esc(x.ten)}</p><p><b>30s:</b> ${esc(x.thirty)}</p></div>
    <div class="blk q"><p>${esc(x.q)}</p></div><div class="blk them"><p><b>Counter:</b> ${esc(x.counter)}</p></div><div class="blk us"><p><b>Final:</b> ${esc(x.final)}</p></div></div></details>`).join("");
  const questions = QUESTIONS.map(q=>`<details class="sub"><summary>${q.id} · ${esc(q.title)} <span class="small muted">(${q.owner}, ${q.primary?"primary":"backup"})</span></summary><div class="stack" style="gap:6px;padding:8px 0 4px">
    <p><b>Open:</b> ${esc(q.open)}</p><p><b>Follow-up:</b> ${esc(q.follow)}</p><p><b>Yes:</b> ${esc(q.yes)}</p><p><b>No:</b> ${esc(q.no)}</p><p><b>Qualified:</b> ${esc(q.qual)}</p>
    <p class="small"><b>Win:</b> ${esc(q.win)} <b>Escape:</b> ${esc(q.escape)} <b>Reply:</b> ${esc(q.reply)}</p></div></details>`).join("");
  const vulns = VULNS.map(v=>`<details class="sub"><summary>${v.v} · ${esc(v.title)} <span class="small muted">(${v.owner})</span></summary><div class="stack" style="gap:6px;padding:8px 0 4px">
    <p><b>Attack:</b> ${esc(v.attack)}</p><p><b>Why a judge might buy it:</b> ${esc(v.why)}</p><p><b>Our response:</b> ${esc(v.resp)}</p><p><b>They attack again:</b> ${esc(v.again)}</p><p><b>Still open:</b> ${esc(v.open)}</p></div></details>`).join("");
  const map = `<div class="tablewrap"><table><thead><tr><th>Assumption</th><th>Their arguments resting on it</th><th>How we attack it</th><th>What remains</th></tr></thead><tbody>${ASSUMPTIONS.map(f=>`<tr><td><b>${f.f}</b> ${esc(f.a)}</td><td class="mono small">${f.deps.map(n=>"#"+n).join(" ")}</td><td>${esc(f.attack)}</td><td>${esc(f.remains)}</td></tr>`).join("")}</tbody></table></div>`;
  const plats = `<div class="tablewrap"><table><thead><tr><th>Type</th><th>Examples</th><th>Control</th><th>Why falsity liability fits badly</th></tr></thead><tbody>${PLATFORMS.map(r=>`<tr>${r.map((c,i)=>`<td>${i===0?"<b>"+esc(c)+"</b>":esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const plan = (()=>{ const S = STRUCTURES[state.structure];
    const rows = Object.keys(S.rounds).map(r=>{ const who=S.rounds[r], len=CONFIG.rounds[r]||120, buf=CONFIG.buffer[r]||10; return `<tr><td><b>${r}</b></td><td class="mono">${fmt(len)}</td><td>${who.join(" → ")}</td><td class="mono">≈${Math.floor((len-buf)/who.length)}s each</td></tr>`; }).join("");
    return `<p class="small">Not final until the competition rules are confirmed. Round lengths live in the CONFIG block at the top of the file.</p>
      <div class="row">${Object.keys(STRUCTURES).map(k=>`<button class="btn" type="button" aria-pressed="${state.structure===k}" data-structure="${k}">${esc(STRUCTURES[k].name)}</button>`).join("")}</div>
      <p class="small">${esc(S.note)}</p><div class="tablewrap"><table><thead><tr><th>Round</th><th>Length</th><th>Order</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table></div>`; })();
  const mock = `<div class="transcript">${MOCK.map(m=>{ if(m[0]==="ROUND") return `<h3 style="padding-top:10px">${esc(m[1])}</h3>`; const cls=m[0].startsWith("G6")?"g6":m[0].startsWith("G5")?"g5":"jd"; return `<div class="turn"><span class="who ${cls}">${esc(m[0])}</span><p>${esc(m[1])}</p></div>`; }).join("")}</div>`;
  const comm = `<div class="tablewrap"><table><thead><tr><th>Step</th><th>Purpose</th><th>Example</th></tr></thead><tbody>${ACEC.map(r=>`<tr><td><b>${r[0]}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>
    <div class="tablewrap"><table><thead><tr><th>Framework</th><th>Source</th><th>What we do</th></tr></thead><tbody>${LEADERSHIP.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td class="small">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>
    <p class="small muted">The “Giovanni principle” isn't included: no published source could be found.</p>`;
  const rubric = `<p class="small">Provisional until the official rubric arrives.</p><div class="tablewrap"><table><thead><tr><th>Criterion</th><th>Weight</th><th>A 5/5 looks like</th></tr></thead><tbody>${RUBRIC.map(r=>`<tr><td>${esc(r[0])}</td><td class="mono">${r[1]}%</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>`;
  const dont = `<div class="tablewrap"><table><thead><tr><th>Don't say</th><th>Why</th></tr></thead><tbody>${DONT_SAY.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td></tr>`).join("")}</tbody></table></div>`;
  const sources = `<div class="tablewrap"><table><thead><tr><th>Title</th><th>Organisation / author</th><th>Why it matters</th></tr></thead><tbody>
    ${EVIDENCE.map(e=>`<tr><td><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a></td><td>${esc(e.src)}</td><td>${esc(e.say)}</td></tr>`).join("")}
    ${DEBATE_SOURCES.map(s=>`<tr><td><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.t)}</a></td><td>${esc(s.o)}</td><td>${esc(s.why)}</td></tr>`).join("")}</tbody></table></div>`;
  return `<div class="stack" style="gap:14px">
    <section class="stack" style="gap:6px"><h2>Advanced prep</h2><p class="muted">Optional. The full research behind the simple version. Nobody needs this to take part.</p></section>
    ${advSection("Speaking plan (choose once the rules are confirmed)", plan, false)}
    ${advSection("Legal distinctions: three kinds of liability", tiers)}
    ${advSection("Evidence vault (34 entries, with limits)", evid)}
    ${advSection("All 15 likely Group 5 arguments, with counter-counters", trees)}
    ${advSection("All 10 strategic questions (full branches)", questions)}
    ${advSection("Our five weak points, attacked twice", vulns)}
    ${advSection("Argument dependency map", map)}
    ${advSection("Which platforms? The spectrum", plats)}
    ${advSection("Full mock debate and judge's verdict", mock)}
    ${advSection("Communication and leadership", comm)}
    ${advSection("Judging framework", rubric)}
    ${advSection("Do not say", dont)}
    ${advSection("Sources", sources)}
  </div>`;
}

/* ============================================================
   EMERGENCY
   ============================================================ */
function renderEmergency(){
  document.getElementById("emergency").innerHTML = `<div class="wrap stack">
    <div class="row between"><h2>Emergency</h2><button class="btn primary" type="button" data-emergency="close">Close</button></div>
    <section class="card"><span class="label">Our position</span><p class="lead">${esc(POSITION)}</p></section>
    <section class="card"><span class="label">Three things you can always say</span><ol>
      <li>“That proves there can be harm. It doesn't yet prove the platform should legally own the user's statement.”</li>
      <li>“If recommendation is the problem, regulate recommendation. That still doesn't make the platform liable because a user's post is false.”</li>
      <li>“If keeping a post can get you sued and deleting it is free, the rule rewards deleting, not getting it right.”</li></ol></section>
    <section class="card"><span class="label">Three questions you can always ask</span><ol>${HUDDLE.questions.map(q=>`<li>${esc(q[1])}</li>`).join("")}</ol></section>
    <section class="card"><span class="label">Three facts</span><ol>
      <li>Meta itself estimated one or two in every ten of its removals may have been mistakes.</li>
      <li>Facebook banned a COVID-origin claim, then reversed itself within four months.</li>
      <li>This year's jury verdicts against platforms were about design and a company's own statements, not users' posts.</li></ol></section>
    <section class="card"><span class="label">30-second closing</span><p class="spoken">${esc(HUDDLE.closing)}</p></section>
  </div>`;
}

/* ============================================================
   TIMERS
   ============================================================ */
let audioCtx = null;
const timer = { total: CONFIG.presets[0], remaining: CONFIG.presets[0], running:false, endAt:0, iv:null, sound: LS.get("sound", false), warned:false };
const countdown = { remaining: 20, running:false, endAt:0, iv:null };
function beep(freq){ if(!timer.sound) return; try{ audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.frequency.value=freq; o.connect(g); g.connect(audioCtx.destination); g.gain.setValueAtTime(0.15,audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.4); o.start(); o.stop(audioCtx.currentTime+0.4);}catch(e){} }
function paint(){
  const tc = timer.remaining <= CONFIG.criticalAt ? "crit" : timer.remaining <= CONFIG.warnAt ? "warn" : "";
  document.querySelectorAll(".js-timer").forEach(el=>{ el.textContent = fmt(timer.remaining); el.classList.toggle("warn", tc==="warn"); el.classList.toggle("crit", tc==="crit"); });
  const cc = countdown.remaining <= 5 ? "crit" : countdown.remaining <= 10 ? "warn" : "";
  document.querySelectorAll(".js-count").forEach(el=>{ el.textContent = fmt(countdown.remaining); el.classList.toggle("warn", cc==="warn"); el.classList.toggle("crit", cc==="crit"); });
}
function tick(){
  timer.remaining = Math.max(0, (timer.endAt - Date.now())/1000);
  if(!timer.warned && timer.remaining <= CONFIG.warnAt && timer.total > CONFIG.warnAt){ timer.warned = true; beep(660); }
  if(timer.remaining <= 0){ timerPause(); beep(440); setTimeout(()=>beep(440),450); }
  paint();
}
function timerStart(){ if(timer.running || timer.remaining<=0) return; timer.running=true; timer.endAt = Date.now() + timer.remaining*1000; timer.iv = setInterval(tick, 200); }
function timerPause(){ timer.running=false; clearInterval(timer.iv); timer.iv=null; }
function timerReset(){ timerPause(); timer.remaining = timer.total; timer.warned=false; paint(); }
function timerSet(s){ timerPause(); timer.total = s; timer.remaining = s; timer.warned=false; paint(); }
function countStart(s){ clearInterval(countdown.iv); countdown.remaining = s; countdown.endAt = Date.now() + s*1000; countdown.running = true;
  countdown.iv = setInterval(()=>{ countdown.remaining = Math.max(0,(countdown.endAt-Date.now())/1000); if(countdown.remaining<=0){ clearInterval(countdown.iv); countdown.running=false; } paint(); }, 200); paint(); }
function countReset(s){ clearInterval(countdown.iv); countdown.running=false; countdown.remaining = s; }

/* ============================================================
   RENDER + EVENTS
   ============================================================ */
function render(){
  document.querySelectorAll(".nav button").forEach(b=>{ const v = b.dataset.go; b.setAttribute("aria-current", v===state.view ? "page" : "false"); });
  app.innerHTML = ({strategy:viewStrategy, role:viewRole, practice:viewPractice, day:viewDay, advanced:viewAdvanced}[state.view] || viewStrategy)();
  paint(); save();
}
function go(view){ state.view = view; render(); window.scrollTo(0,0); }
function goStep(id){
  if(id === "challenge" || id === "attacks"){ state.practice = id; countReset(id==="attacks"?20:60); return go("practice"); }
  go(id);
}

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  const d = t.dataset;
  if(d.go) return go(d.go);
  if(d.step) return goStep(d.step);
  if(d.emergency === "open"){ renderEmergency(); document.getElementById("emergency").hidden = false; return; }
  if(d.emergency === "close"){ document.getElementById("emergency").hidden = true; return; }
  if(d.person !== undefined){ state.person = d.person || null; state.deeper = false; render(); window.scrollTo(0,0); return; }
  if(d.deeper){ state.deeper = !state.deeper; render(); return; }
  if(d.practice){ state.practice = d.practice; countReset(d.practice==="attacks"?20:60); render(); return; }
  if(d.count){ countStart(Number(d.count)); return; }
  if(d.chstep){ state.chStep = Number(d.chstep); render(); return; }
  if(d.ch){ state.ch = (state.ch + 1) % CHALLENGES.length; state.chStep = 0; countReset(60); render(); return; }
  if(d.atstep){ state.atStep = Number(d.atstep); render(); return; }
  if(d.at){ state.at = d.at==="prev" ? Math.max(0, state.at-1) : (state.at + 1) % ATTACKS.length; state.atStep = 0; countReset(20); render(); return; }
  if(d.point){ const pts = LS.get("points", {P1:0,P2:0,P3:0,P4:0,P5:0}); if(d.point==="reset"){ Object.keys(pts).forEach(k=>pts[k]=0); } else { pts[d.point]=(pts[d.point]||0)+1; } LS.set("points", pts); render(); return; }
  if(d.daylink){ state.dayLink = state.dayLink===d.daylink ? null : d.daylink; render(); return; }
  if(d.daytopic !== undefined){ const i = Number(d.daytopic); state.dayTopic = state.dayTopic===i ? null : i; render(); return; }
  if(d.preset){ timerSet(Number(d.preset)); return; }
  if(d.timer){ ({start:timerStart, pause:timerPause, reset:timerReset})[d.timer](); return; }
  if(d.structure){ state.structure = d.structure; render(); return; }
});
document.addEventListener("input", e=>{
  const t = e.target;
  if(t.dataset.note){ const [p,f] = t.dataset.note.split("|"); const notes = LS.get("notes", {}); notes[p] = notes[p]||{}; notes[p][f] = t.value; LS.set("notes", notes); }
});
document.addEventListener("change", e=>{ if(e.target.id==="soundToggle"){ timer.sound = e.target.checked; LS.set("sound", timer.sound); if(timer.sound) beep(880); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape") document.getElementById("emergency").hidden = true; });

countReset(state.practice==="attacks"?20:60);
render();
</script>
